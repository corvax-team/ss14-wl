- type: reagent
  id: Ritium
  name: reagent-name-ritium
  group: Biorobotic
  desc: reagent-desc-ritium
  flavor: oily
  color: "#224dff"
  recognizable: true
  physicalDesc: reagent-physical-desc-viscous
  viscosity: 0.25
  tileReactions:
    - !type:SpillTileReaction
  metabolisms:
    Bloodstream:
      effects:
      - !type:SatiateThirst
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Biorobotic ]
        factor: 2
      - !type:ModifyBloodLevel
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Biorobotic ]
        amount: 1

- type: reagent
  id: Oxidant
  name: reagent-name-oxidant
  group: Biorobotic
  desc: reagent-desc-oxidant
  flavor: metallic
  color: "#450b0b"
  physicalDesc: reagent-physical-desc-dark-red
  viscosity: 0.1
  metabolisms:
    Bloodstream:
      metabolismRate: 0.1
      effects:
      - !type:ModifyBloodLevel
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Biorobotic ]
        amount: 2
      - !type:ModifyBleed
        amount: -1.5
      - !type:EvenHealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Biorobotic ]
        damage:
          Airloss: -3

- type: reagent
  id: RepairFoam
  name: reagent-name-repairfoam
  group: Biorobotic
  desc: reagent-desc-repairfoam
  flavor: acid
  color: "#627280"
  physicalDesc: reagent-physical-desc-foamy
  reactiveEffects:
    Biorobotic:
      methods: [ Touch ]
      effects:
      - !type:ModifyBleed
        amount: -0.5
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Slash: -0.3
            Piercing: -0.3
      - !type:PopupMessage
        type: Pvs
        visualType: MediumCaution
        messages: [ "bioropotic-foam-activation-popup" ]
        probability: 1
  metabolisms:
    Bloodstream:
      metabolismRate: 1
      effects:
      - !type:ModifyBleed
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Biorobotic ]
        amount: -1.5
      - !type:HealthChange
        conditions:
        damage:
          types:
            Asphyxiation: 2

- type: reagent
  id: RPLKStim
  name: reagent-name-rplkstim
  group: Biorobotic
  desc: reagent-desc-rplkstim
  physicalDesc: reagent-physical-desc-pungent
  flavor: tingly
  color: "#00bdbd"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        conditions:
          # they gotta be in crit first
        - !type:MobStateCondition
          mobstate: Critical
        - !type:MetabolizerTypeCondition
          type: [ Biorobotic ]
        damage:
          types:
            Asphyxiation: -3
            Blunt: 0.1
            Heat: 0.1
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: RPLKStim
          min: 20
        - !type:MetabolizerTypeCondition
          type: [ Biorobotic ]
        damage:
          types:
            Asphyxiation: 1
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        time: 0.75
        type: Remove
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Biorobotic ]
      - !type:ModifyKnockdown
        time: 0.75
        type: Remove
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Biorobotic ]
      - !type:GenericStatusEffect
        key: Adrenaline
        component: IgnoreSlowOnDamage
        time: 5
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Biorobotic ]
      - !type:MovementSpeedModifier
        walkSpeedModifier: 1.1
        sprintSpeedModifier: 1.1
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Biorobotic ]
      - !type:ModifyStatusEffect
        effectProto: StatusEffectForcedSleeping
        time: 3
        type: Remove
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Biorobotic ]
      - !type:Jitter

