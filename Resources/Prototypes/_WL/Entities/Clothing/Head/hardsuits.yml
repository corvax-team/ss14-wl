- type: entity
  parent: [ ClothingHeadHardsuitBase, TemperatureProtectionGood ]
  id: ClothingHeadHelmetHardsuitScience
  name: science hardsuit helmet
  description: A special hardsuit helmet designed for working in low-pressure, high thermal environments.
  components:
  - type: Sprite
    sprite: _WL/Clothing/Head/Hardsuits/scienvi.rsi
  # WL-changes-Start
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
  # WL-changes-End
  - type: Tag
    tags:
    - WhitelistChameleon

- type: entity
  parent: [ BaseCentcommContraband, ClothingHeadHelmetHardsuitSyndieCommander ]
  id: ClothingHeadHelmetHardsuitBlueShield
  name: blue shield hardsuit helmet
  description: A special helmet worn by the bodyguards of the "first persons".
  components:
  # WL-changes-Start
  - type: Sprite
    sprite: _WL/Clothing/Head/Hardsuits/blueshield.rsi
    layers:
    - state: icon
    - state: icon-flash
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: Clothing
    sprite: _WL/Clothing/Head/Hardsuits/blueshield.rsi
    clothingVisuals:
      head:
      - state: off-equipped-HELMET
  - type: ToggleableVisuals
    clothingVisuals:
      head:
      - state: on-equipped-HELMET
  # WL-changes-End
  - type: PointLight # Corvax-Resprite
    color: cyan
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9

#Security light hardsuit
- type: entity
  parent: ClothingHeadHelmetHardsuitSecurity
  id: ClothingHeadHelmetHardsuitSecurityLight
  name: security light hardsuit helmet
  description: Reinforced helmet with a large visor for better visibility.
  components:
  - type: Sprite
    sprite: _WL/Clothing/Head/Hardsuits/security_lighthelm.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: _WL/Clothing/Head/Hardsuits/security_lighthelm.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET
  - type: ToggleableVisuals
    clothingVisuals:
      head:
      - state: equipped-HELMET
  - type: ItemTogglePointLight
  - type: PointLight
    color: "#ffeead"
  - type: PressureProtection
    highPressureMultiplier: 0.525
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: Tag
    tags:
    - WhitelistChameleon