# Визоры

- type: entity
  parent: [ClothingEyesBase, ShowSecurityIcons, BaseSecurityContraband]
  id: ClothingEyesBallisticSecurity
  name: ballistic security glasses
  description: Ballistic glasses that provide flash immunity and a security HUD.
  components:
  - type: Sprite
    sprite: _WL/Clothing/Eyes/Hud/ballistic.rsi
  - type: Clothing
    sprite: _WL/Clothing/Eyes/Hud/ballistic.rsi
  - type: FlashImmunity
  - type: EyeProtection
    protectionTime: 5
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: IdentityBlocker
    coverage: EYES

- type: entity
  parent: [ClothingEyesBase, ShowSecurityIcons, BaseCentcommContraband]
  id: ClothingEyesGlassesBlueShield
  name: ballistic blue shield glasses
  description: Ballistic glasses that provide flash immunity and a security HUD.
  components:
  - type: Sprite
    sprite: _WL/Clothing/Eyes/Hud/ballisticbs.rsi
  - type: Clothing
    sprite: _WL/Clothing/Eyes/Hud/ballisticbs.rsi
  - type: FlashImmunity
  - type: EyeProtection
    protectionTime: 5
  - type: Construction
    graph: GlassesSecHUD
    node: glassesSec
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: IdentityBlocker
    coverage: EYES
  - type: NightVisionEye
    isEquipment: true

