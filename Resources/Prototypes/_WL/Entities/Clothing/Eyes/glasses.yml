- type: entity
  parent: [ClothingEyesBase, ShowSecurityIcons, BaseSecurityContraband]
  id: ClothingEyesBallisticSecurity
  name: ballistic security glasses
  description: Ballistic glasses that provide flash immunity and a security HUD.
  components:
  - type: Sprite
    sprite: _WL/Clothing/Eyes/ballistic.rsi
  - type: Clothing
    sprite: _WL/Clothing/Eyes/ballistic.rsi
  - type: FlashImmunity
  - type: EyeProtection
    protectionTime: 5
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: IdentityBlocker
    coverage: EYES

- type: entity
  parent: [ClothingEyesBase, ShowSecurityIcons, BaseCentcommContraband]
  id: ClothingEyesGlassesBlueShield
  name: ballistic blue shield glasses
  description: Ballistic glasses that provide flash immunity and a security HUD.
  components:
  - type: Sprite
    sprite: _WL/Clothing/Eyes/ballisticbs.rsi
  - type: Clothing
    sprite: _WL/Clothing/Eyes/ballisticbs.rsi
  - type: FlashImmunity
  - type: EyeProtection
    protectionTime: 5
  - type: Construction
    graph: GlassesSecHUD
    node: glassesSec
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: IdentityBlocker
    coverage: EYES
  - type: NightVisionEye
    isEquipment: true

- type: entity
  parent: [ClothingEyesBase, BaseEngineeringContraband]
  id: ClothingEyesGlassesGogglesTrayEngineer
  name: t-ray goggles
  description: Goggles that protect your eyes and work like t-ray but better.
  components:
  - type: Sprite
    sprite: _WL/Clothing/Eyes/engoggles.rsi
  - type: Clothing
    sprite: _WL/Clothing/Eyes/engoggles.rsi
    slots:
    - HEAD
    - EYES
    clothingVisuals:
      head:
      - state: equipped-HEAD
      eyes:
      - state: equipped-EYES
    equipSound:
      collection: GogglesEquip
  - type: TrayScanner
    range: 8
  - type: UseDelay
    delay: 1
  - type: GenericVisualizer
    visuals:
      enum.TrayScannerVisual.Visual:
        base:
          On: { state: icon }
          Off: { state: icon }
  - type: EmitSoundOnPickup
    sound:
      collection: GogglesPickup
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      collection: GogglesDrop
      params:
        volume: -4
  - type: EyeProtection
  - type: IdentityBlocker
    coverage: EYES
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: Construction
    graph: GogglesTray
    node: trayGoggles
