    sprite: _WL/Clothing/OuterClothing/Coats/aidedecamp.rsi
  - type: Clothing
    sprite: _WL/Clothing/OuterClothing/Coats/aidedecamp.rsi
  - type: StaticPrice
    price: 2500
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Heat: 0.8

