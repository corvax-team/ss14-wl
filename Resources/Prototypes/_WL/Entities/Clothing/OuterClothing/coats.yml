- type: entity
  parent: [ClothingOuterStorageBase, ClothingOuterStorageFoldableBase]
  id: ClothingOuterCoatCaptainTrench
  name: captain's trench coat
  description: A fashionable trench coat made by the masters of their craft. It consists of excellent quality textiles, but even so, it is unlikely to protect you from anything.
  components:
  - type: Sprite
    sprite: _WL/Clothing/OuterClothing/Coats/captain_trenchcoat.rsi
  - type: Clothing
    sprite: _WL/Clothing/OuterClothing/Coats/captain_trenchcoat.rsi
  - type: StaticPrice
    price: 4999
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Heat: 0.7

- type: entity
  parent: [ClothingOuterCoatCaptainTrench, ClothingOuterStorageFoldableBaseOpened]
  id: ClothingOuterCoatCaptainTrenchOpened
  name: captain's trench coat

