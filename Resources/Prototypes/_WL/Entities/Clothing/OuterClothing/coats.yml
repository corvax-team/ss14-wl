    sprite: _WL/Clothing/OuterClothing/Coats/trenchcoats/tan.rsi
  - type: Clothing
    sprite: _WL/Clothing/OuterClothing/Coats/trenchcoats/tan.rsi
  - type: TemperatureProtection
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1
  - type: Armor
    modifiers:
      coefficients:
        Slash: 0.95
  - type: Edible
    requiresSpecialDigestion: true
