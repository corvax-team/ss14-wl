- type: entity
  parent: ClothingBeltBase
  id: ClothingBeltHolsterSMG
  name: smg shoulder holster
  description: 'Holster for submachine guns. Can be worn under a coat and over a bulletproof vest. Has 2 magazine pouches.'
  components:
  - type: Sprite
    sprite: _WL/Clothing/Belt/holstersmg.rsi
  - type: Clothing
    sprite: _WL/Clothing/Belt/holstersmg.rsi
    slots:
    - suitStorage
    - Belt
  - type: Item
    size: Ginormous
  - type: ItemSlots
    slots:
      item:
        insertSound:
          collection: storageRustle
        ejectSound: /Audio/Weapons/Guns/Misc/selector.ogg
        name: clothing-holster-sidearm
        priority: 4
        whitelist:
          tags:
          - SMG
      gun_magazine_1:
        name: clothing-holster-spare-magzine
        insertSound:
          collection: storageRustle
        ejectSound:
          collection: storageRustle
        startingItem: null
        priority: 3
        whitelist:
          tags:
            - MagazinePistolSubMachineGunTopMounted
            - MagazinePistolSubMachineGun
      gun_magazine_2:
        name: clothing-holster-spare-magzine
        insertSound:
          collection: storageRustle
        ejectSound:
          collection: storageRustle
        startingItem: null
        priority: 2
        whitelist:
          tags:
            - MagazinePistolSubMachineGunTopMounted
            - MagazinePistolSubMachineGun
  - type: ItemMapper
    mapLayers:
      icon-overlay:
        whitelist:
          tags:
          - SMG
  - type: Appearance

- type: entity
