- type: entity
  id: HairComb
  name: hair comb
  description: Gotta brush that hair that you have.
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _WL/Objects/Tools/haircomb.rsi
    state: icon
  - type: Item
    storedSprite:
      state: storage
      sprite: _WL/Objects/Tools/haircomb.rsi
  - type: MagicMirror
    modifyTime: 3
    organs:
    - Head
    layers:
    - Hair
    - FacialHair
  - type: ActivatableUI
    key: enum.MagicMirrorUiKey.Key
    inHandsOnly: true
    requireActiveHand: true
  - type: UserInterface
    interfaces:
      enum.MagicMirrorUiKey.Key:
        type: MagicMirrorBoundUserInterface
  - type: PhysicalComposition
    materialComposition:
      Steel: 2

- type: entity
