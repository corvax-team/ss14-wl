- type: entity
  parent: BaseHealingItem
  id: BioTube
  name: bio tube
  description: Replaces the veins of androids.
  suffix: Full
  components:
  - type: Tag
    tags:
    - Gauze
  - type: Sprite
    sprite: _WL/Entities/Objects/Specific/Medical/medical.rsi
    state: bio_tube
  - type: Healing
    damageContainers:
      - BioRobotic
    damage:
      types:
        Slash: -10
        Piercing: -5
    bloodlossModifier: -3
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
  - type: Stack
    stackType: BioTube
    count: 10
  - type: StackPrice
    price: 5

- type: entity
  id: BioTube1
