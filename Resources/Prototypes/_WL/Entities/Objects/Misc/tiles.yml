    sprite: _WL/Objects/Tiles/tile.rsi
    state: steel-diagonal-mini
  - type: FloorTile
    outputs:
      - Plating
      - FloorSteelDiagonalMini
  - type: Stack
    stackType: FloorTileSteelDiagonalMini

- type: entity
  name: white steel diagonal mini tile
