- type: entity
  parent: BaseItem
  id: Wallet
  name: wallet
  description: A small leather wallet. It has a slot for an id-card.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _WL/Objects/Misc/Wallets/leather.rsi
    layers:
    - state: icon
      map: [ "base" ]
    - state: blank
      map: [ "enum.WalletVisualLayers.IdBase" ]
      visible: false
    - state: blank
      map: [ "enum.WalletVisualLayers.IdIcon" ]
      visible: false
    - state: overlay
      map: [ "enum.WalletVisualLayers.Frame" ]
      visible: false
  - type: Appearance
  - type: Wallet
  - type: Clothing
    quickEquip: false
    slots:
    - idcard
  - type: Storage
    grid:
    - 0,0,3,1
    maxItemSize: Small
    whitelist:
      tags:
      - Paper
      components:
      - Passport
      - IgnitionSource # For lighters
      - Cash
      - Injector # Hypospray and medipens
      - NukeDisk
    blacklist:
      tags:
      - CigPack
      components:
      - Storage
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ItemSlots
    slots:
      idSlot:
        whitelist:
          components:
          - IdCard
  - type: ContainerContainer
    containers:
      idSlot: !type:ContainerSlot
      storagebase: !type:Container
  - type: Tag
    tags:
    - DoorBumpOpener

