- type: entity
  parent: [BaseFoldable, BaseItem]
  id: BasePasport
  name: pasport
  descripton: Papers, please!
  abstract: true
  components:
  - type: Appearance
  - type: Foldable
    folded: true
    canFoldInsideContainer: true
    unfoldVerbText: "Open"
    foldVerbText: "Close"
  - type: Item
    size: Small
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
    storedRotation: 0
  - type: Sprite
    layers:
    - state: icon-opened
      map: [ "unfoldedLayer" ]
    - state: icon
      map: ["foldedLayer"]
      visible: false

- type: entity
  parent: BasePasport
  id: AlliancePasport
  name: alliance pasport
  components:
  - type: Sprite
    sprite: _WL/Objects/Misc/Pasports/alliance.rsi

