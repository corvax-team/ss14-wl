- type: entity
  parent: BaseItem
  id: Wallet
  name: wallet
  description: A small leather wallet. It has a slot for an id-card.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _WL/Objects/Misc/wallet.rsi
    layers:
    - state: icon
      map: [ "base" ]
    - state: blank
      map: [ "enum.WalletVisualLayers.IdBase" ]
      visible: false
    - state: blank
      map: [ "enum.WalletVisualLayers.IdIcon" ]
      visible: false
    - state: overlay
      map: [ "enum.WalletVisualLayers.Frame" ]
      visible: false
  - type: Appearance
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: PDA
    prefix: device-address-prefix-console
    savableAddress: false
  - type: Wallet
  - type: Clothing
    quickEquip: false
    slots:
    - idcard
  - type: Storage
    grid:
    - 0,0,3,1
    maxItemSize: Small # Todo whitelist
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ItemSlots
    slots:
      idSlot:
        whitelist:
          components:
          - IdCard
  - type: ContainerContainer
    containers:
      idSlot: !type:ContainerSlot
  - type: Tag
    tags:
    - DoorBumpOpener
