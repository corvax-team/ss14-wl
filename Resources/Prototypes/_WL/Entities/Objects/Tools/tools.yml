- type: entity
  parent: RPD
  id: BluespaceRPD
  name: bluespace RPD
  description: A bluespace device used to rapidly pipe things.
  components:
  - type: RCD
    range: -1
    enableIgnite: false
  - type: LimitedCharges
    maxCharges: 600
  - type: Sprite
    sprite: _WL/Objects/Tools/brpd.rsi

