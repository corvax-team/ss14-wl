- type: entity
  parent: FlippoLighter
  id: FlippoEngravedLighterComrade
  name: an expensive engraved lighter
  description: A durable gold-plated metal lighter built to last. Its body features the engraved initials "V.Sh." in a calligraphic script, along with various intricate ornamental designs. The lighter appears almost new.
  components:
  - type: Sprite
    sprite: Objects/Tools/Lighters/lighters.rsi
    layers:
    - state: zippo_engraved_icon_base
      map: ["base"]
    - state: zippo_top
      map: ["top"]
      visible: false
    - state: zippo_engraved_open
      map: ["open"]
      visible: false
    - state: lighter_flame
      map: ["flame"]
      visible: false
      shader: unshaded

- type: entity
  parent: FlippoLighter
  id: FlippoEngravedLighterWhitley
  name: gold flippo lighter
  description: A flip-top lighter with a gold-anodized finish. It frequently turns up in the pockets of low-ranking military officers. Gaudy, yet it certainly stands out.
  components:
  - type: Sprite
    sprite: _WL/Objects/Tools/Lighters/lighter_whitley.rsi
    layers:
    - state: gold_icon_base
      map: ["base"]
    - state: gold_top
      map: ["top"]
      visible: false
    - state: gold_open
      map: ["open"]
      visible: false
    - state: lighter_flame
      map: ["flame"]
      visible: false
      shader: unshaded
  - type: Item
    sprite: _WL/Objects/Tools/Lighters/lighter_whitley.rsi
    heldPrefix: gold
  - type: ToggleableVisuals
    inhandVisuals:
      left:
      - state: gold-inhand-left-flame
        shader: unshaded
      right:
      - state: gold-inhand-right-flame
        shader: unshaded
