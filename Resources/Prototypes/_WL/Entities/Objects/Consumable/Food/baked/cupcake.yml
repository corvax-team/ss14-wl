- type: entity
  parent: [SolutionNormal, FoodInjectableBase]
  id: FoodCupcakeBase
  name: plain cupcake
  description: More like a muffin, honestly.
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _WL/Entities/Objects/Consumable/Food/baked/cupcake.rsi
    layers:
    - state: base
    - map: ["foodSequenceLayers"]
  - type: FoodSequenceStartPoint
    key: Cupcake
    contentSeparator: " "
    maxLayers: 2
    startPosition: 0, 0
    offset: 0, 0
    minLayerOffset: 0, 0
    maxLayerOffset: 0, 0
    nameGeneration: food-sequence-cupcake-gen
  - type: Appearance
  - type: Solution
    solution:
      maxVol: 8
      canReact: false
      reagents:
      - ReagentId: Nutriment
        Quantity: 5

- type: entity
  parent: FoodInjectableBase
  id: PastryCream
  name: white pastry cream
  description: perfect for a cupcake
  components:
    - type: Item
    - type: FlavorProfile
      flavors:
        - sweet
    - type: Edible
      transferAmount: 5
    - type: Sprite
      sprite: _WL/Entities/Objects/Consumable/Food/baked/cupcake.rsi
      state: cream_white
    - type: Solution
      solution:
        reagents:
        - ReagentId: Cream
          Quantity: 3
    - type: FoodSequenceElement
      entries:
        Cupcake: CupcakeCream
    - type: Stack
      stackType: PastryCream
      count: 10

