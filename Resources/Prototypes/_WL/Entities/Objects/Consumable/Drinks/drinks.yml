- type: entity
  parent: [DrinkVisualsAllFilled, DrinkBottlePlasticSmallBaseFull]
  id: DrinkInsulatorBottleFull
  name: insulator bottle
  description: Simple clean insulator of unknown origin. You think that maybe you dont want to know it.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Insulator
        Quantity: 60
  - type: Sprite
    sprite: Objects/Consumable/Drinks/waterbottle.rsi
  - type: Label
    localizedLabel: reagent-name-insulator

- type: entity
  parent: DrinkGlass
  id: DrinkDarkBeerGlass
  suffix: dark beer
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: DarkBeer
        Quantity: 60
  - type: Icon
    sprite: _WL/Objects/Consumable/Drinks/darkbeerglass.rsi
    state: icon
