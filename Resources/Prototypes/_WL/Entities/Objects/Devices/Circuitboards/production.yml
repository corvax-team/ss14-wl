- type: entity
  parent: BaseMachineCircuitboard
  id: ThrusterSmallMachineCircuitboard
  name: small thruster machine board
  components:
  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: ThrusterSmall
    stackRequirements:
      Manipulator: 1
      Steel: 5
      MetalRod: 2

- type: entity
