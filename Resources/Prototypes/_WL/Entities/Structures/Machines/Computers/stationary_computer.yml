- type: entity
  parent: BaseComputerAiAccess
  id: StationaryComputer
  suffix: DEBUG
  components:
  - type: StationaryComputer
    baseContent:
    - stationary-computer-welcome-string
  - type: ActivatableUI
    key: enum.StationaryComputerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.StationaryComputerUiKey.Key:
        type: StationaryComputerBUI
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  parent: BaseComputerAiAccess
  id: PointsReaderDebugComputer
  suffix: DEBUG
  name: debug points reader
  components:
  - type: DataReader
  - type: ItemSlots
    slots:
      storage_slot:
        name: хуеприёмник
  - type: ActivatableUI
    key: enum.PointsDataReaderUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PointsDataReaderUiKey.Key:
        type: PointsDataReadBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: DataStorage
    name: UwU points
    allowedStorageFormats:
      - PointsFormat
    currentStorageFormat: PointsFormat
    size: 65536

