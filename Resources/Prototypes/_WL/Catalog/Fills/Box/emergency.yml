- type: entity
  parent: BoxSurvival
  id: BoxSurvivalBiorobotic
  name: biorobotic survival box
  suffix: Biorobotic
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: EmergencyNitrogenTankFilled
        - id: BioroboticMedipen
        - id: Flare
        - id: RepairTape
        - id: DrinkInsulatorBottleFull
  - type: Sprite
    layers:
    - state: internals
    - state: nitrogentank
  - type: Label
    currentLabel: biorobotic-box-label

