- type: entity
  name: Архосс
  id: MobArhoss
  parent: SimpleSpaceMobBase
  description: Великое существо
  abstract: true
  components:
  - type: CombatMode
    canDisarm: false
  - type: Inventory
#  - type: RotationVisuals
#    defaultRotation: 90
#    horizontalRotation: 90
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 400
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Sprite
    drawdepth: Mobs
    sprite: /Uploaded/arhoss/arhoss.rsi
    offset: 0,0.2
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: running
  - type: ComplexInteraction
  - type: Body
    prototype: Primate
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 30
    animation: WeaponArcBite
    damage:
      types:
        Brute: 15
  - type: Puller
    needsHands: false
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: IdExaminable
  - type: Crawler
  - type: DamageStateVisuals
    states:
      Alive:
        Base: running
      Dead:
        Base: dead
  - type: TypingIndicator
    proto: alien
  - type: NoSlip
  - type: Speech
    speechVerb: LargeMob
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Dead
  - type: MovementSpeedModifier
    baseSprintSpeed: 3.7
  - type: Hands