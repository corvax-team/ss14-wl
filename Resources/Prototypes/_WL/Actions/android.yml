- type: entity
  parent: BaseToggleAction
  id: ActionToggleAndroidLight
  name: Toggle Light
  description: Turn the light on and off.
  components:
  - type: Action
    useDelay: 1
  - type: Sprite
    sprite: _WL/Interface/Actions/android.rsi
    layers:
    - state: light-off
      map: ["enum.ActionVisuals.Icon"]
    - state: light-on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
