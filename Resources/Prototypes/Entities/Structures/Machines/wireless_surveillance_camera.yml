- type: entity
  abstract: true
  parent: [ BaseStructureDynamic, SmallConstructibleMachine ]
  id: SurveillanceWirelessCameraBase
  name: wireless camera
  description: A camera. It's watching you. Kinda.
  components:
    #WL-Changes: включение/выключение Start
    - type: ItemToggle
      soundActivate:
        path: /Audio/Machines/button.ogg
      soundDeactivate:
        path: /Audio/Machines/button.ogg
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.ToggleableVisuals.Enabled:
          enable:
            True: { visible: true }
            False: { visible: false }
    #WL-Changes: включение/выключение End
    - type: InteractionOutline
    - type: Eye
    - type: WirelessNetworkConnection
      range: 200
    - type: Damageable
      damageModifierSet: Metallic
    - type: Injurable
      damageContainer: StructuralInorganic
    - type: Rotatable
      rotateWhileAnchored: true
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.45
          density: 80
          mask:
            - MachineMask
          layer:
            - BulletImpassable
    - type: SurveillanceCameraMicrophone
      blacklist:
        components:
          - SurveillanceCamera
          - SurveillanceCameraMonitor
          - RadioSpeaker
    - type: ActiveListener
      range: 10
    - type: UserInterface
      interfaces:
        enum.SurveillanceCameraSetupUiKey.Camera:
          type: SurveillanceCameraSetupBoundUi
  placement:
    mode: SnapgridCenter

- type: entity
  abstract: true
  id: SurveillanceWirelessCameraAnchoredBase
  parent: SurveillanceWirelessCameraBase
  suffix: Anchored
  components:
    - type: Machine
      board: SurveillanceWirelessCameraAnchoredCircuitboard
    - type: Anchorable
    - type: Transform
      anchored: true
    - type: Physics
      bodyType: Static
    - type: Sprite
      noRot: true
      sprite: Structures/monitors.rsi
      #WL-Changes start
      layers:
      - state: television
      - state: on
        visible: false
        shader: unshaded
        map: [ "enable" ]
      #WL-Changes end

- type: entity
  abstract: true
  id: SurveillanceWirelessCameraMovableBase
  parent: SurveillanceWirelessCameraBase
  suffix: Movable
  components:
    - type: Machine
      board: SurveillanceWirelessCameraMovableCircuitboard
    - type: Transform
    - type: Sprite
      noRot: true
      sprite: Structures/monitors.rsi
      #WL-Changes: анимация включения/выключения Start
      layers:
      - state: mobilevision
      - state: on
        visible: false
        shader: unshaded
        map: [ "enable" ]
      #WL-Changes: анимация включения/выключения End

- type: entity
  parent: SurveillanceWirelessCameraAnchoredBase
  suffix: Constructed, Anchored
  id: SurveillanceWirelessCameraAnchoredConstructed
  components:
    - type: DeviceNetwork
      deviceNetId: Wireless
      receiveFrequencyId: SurveillanceCamera
      transmitFrequencyId: SurveillanceCamera
    - type: SurveillanceCamera
      active: false # WL-Changes
      setupAvailableNetworks:
        - SurveillanceCameraEntertainment

- type: entity
  parent: SurveillanceWirelessCameraMovableBase
  suffix: Constructed, Movable
  id: SurveillanceWirelessCameraMovableConstructed
  components:
    - type: DeviceNetwork
      deviceNetId: Wireless
      receiveFrequencyId: SurveillanceCameraEntertainment
      transmitFrequencyId: SurveillanceCamera
    - type: SurveillanceCamera
      active: false # WL-Changes
      setupAvailableNetworks:
        - SurveillanceCameraEntertainment

- type: entity
  parent: SurveillanceWirelessCameraAnchoredBase
  suffix: Entertainment, Anchored
  id: SurveillanceWirelessCameraAnchoredEntertainment
  components:
    - type: DeviceNetwork
      deviceNetId: Wireless
      receiveFrequencyId: SurveillanceCameraEntertainment
      transmitFrequencyId: SurveillanceCamera
    - type: SurveillanceCamera
      active: false # WL-Changes
      networkSet: true

- type: entity
  parent: SurveillanceWirelessCameraMovableBase
  suffix: Entertainment, Movable
  id: SurveillanceWirelessCameraMovableEntertainment
  components:
    - type: DeviceNetwork
      deviceNetId: Wireless
      receiveFrequencyId: SurveillanceCameraEntertainment
      transmitFrequencyId: SurveillanceCamera
    - type: SurveillanceCamera
      active: false # WL-Changes
      networkSet: true
