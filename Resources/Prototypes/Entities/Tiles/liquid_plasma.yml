- type: entity
  id: FloorLiquidPlasmaEntity
  name: liquid phoron
  description: Sweet, expensive nectar. Don't consume.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: TileEmission
    color: "#c906f3"
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
      - Catwalk
  - type: TileEntityEffect
    effects:
    - !type:LavaPrepareFlammable # WL-Changes
    - !type:Flammable
      multiplier: 3.75
      multiplierOnExisting: 0.75
    - !type:Ignite
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: Tiles/TileEntities/liquid-phoron.rsi
    drawdepth: BelowFloor
  - type: Icon
    sprite: Tiles/TileEntities/liquid-phoron.rsi
    state: full
  - type: IconSmooth
    key: phoron
    base: water
    additionalKeys:
    - walls
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - WallLayer # WL-Changes: before `SlipLayer`
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: Tag
    tags:
    - HideContextMenu
# WL-Changes-Start
  - type: FloorOccluder
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
# WL-Changes-End
  - type: PlacementReplacement
    key: tileOverlay
