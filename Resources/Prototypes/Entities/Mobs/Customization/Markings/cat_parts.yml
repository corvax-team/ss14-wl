- type: marking
  id: CatEars
  #WL-Changes: Felinid revolution start
  bodyPart: HeadTop
  groupWhitelist: [Felinid, Human, Android]
  sponsorOnly: false
  #WL-Changes: Felinid revolution end
  coloring:
    default:
      type: !type:CategoryColoring
        category: Hair
      fallbackTypes:
      - !type:SkinColoring {}
  sprites:
  - sprite: Mobs/Customization/cat_parts.rsi
    state: ears_cat_outer
  - sprite: Mobs/Customization/cat_parts.rsi
    state: ears_cat_inner
    coloring:
      type: !type:SimpleColoring
        color: '#FFFFFF'

- type: marking
  id: CatTail
  #WL-Changes: Felinid revolution start
  bodyPart: Tail
  groupWhitelist: [Felinid, Human, Android]
  sponsorOnly: false
  #WL-Changes: Felinid revolution end
  coloring:
    default:
      type: !type:CategoryColoring
        category: Hair
      fallbackTypes:
      - !type:CategoryColoring
        category: FacialHair
      - !type:SkinColoring {}
  sprites:
  - sprite: Mobs/Customization/cat_parts.rsi
    state: tail_cat_wag # Corvax-Sponsors
