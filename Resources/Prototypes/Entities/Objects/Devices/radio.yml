- type: entity
  name: handheld radio
  description: A handy handheld radio.
  parent: BaseItem
  id: RadioHandheld
  components:
  - type: TelecomExempt
  - type: RadioMicrophone
    broadcastChannel: Handheld
  - type: RadioSpeaker
    channels:
    - Handheld
  - type: Speech
    speechVerb: Robotic
  - type: Sprite
    sprite: _WL/Objects/Devices/communication.rsi # WL-Changes-resprite
    layers:
    - state: walkietalkie
    - state: walkietalkie-on
    state: walkietalkie
  - type: Item
    sprite: _WL/Objects/Devices/communication.rsi # WL-Changes-resprite
    heldPrefix: walkietalkie
  - type: Tag
    tags:
    - Radio
  - type: Languages # WL-Changes
  
- type: entity
  name: security radio
  description: A handy security radio.
  parent: [ RadioHandheld, BaseSecurityContraband ]
  id: RadioHandheldSecurity
  components:
  - type: RadioMicrophone
    broadcastChannel: Security
    listenRange: 1
  - type: RadioSpeaker
    channels:
    - Security
  - type: Sprite
    sprite: _WL/Objects/Devices/securityhandy.rsi # WL-Changes-resprite
  - type: Item
    sprite: _WL/Objects/Devices/securityhandy.rsi # WL-Changes-resprite
    heldPrefix: walkietalkie
