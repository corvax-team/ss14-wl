- type: entity
  parent: RCD
  id: RPD
  name: RPD
  description: A device used to rapidly pipe things.
  components:
  - type: RCD
    isRpd: true
    availablePrototypes:
    - PipeFourway
    - PipeStraight
    - PipeBend
    - PipeTJunction
    - OutletInjector
    - ManualValve
    - VolumetricPump
    - PressurePump
    - VentScrubber
    - PressureValve
    - DualPortVent
    - VentGas
    - VentPassive
    - MixerGas
    - Radiator
    - SignalValve
    - CanisterPort
    - FilterGas
    - Deconstruct
  - type: LimitedCharges
    maxCharges: 45
  - type: Sprite
    sprite: _Goobstation/Objects/Tools/rpd.rsi
  # WL-Sounds-Start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_WL/Items/handling/rpd_pickup.ogg
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_WL/Items/handling/rpd_drop.ogg
      params:
        volume: -4
  # WL-Sounds-End
