- type: entity
  parent: [ SimpleSpaceMobBase, MobRespirator, MobAtmosStandard, MobNightVision ]
  id: MobCorticalBorer
  name: larva
  description: A small, writhing creature.
  components:
  - type: CorticalBorer
  - type: NameIdentifier
    group: null
  - type: UserInterface
    interfaces:
      enum.CorticalBorerUiKey.Key:
        type: CorticalBorerBoundUserInterface
  - type: Speech
    speechSounds: CorticalBorer
    speechVerb: SmallMob
  - type: ReplacementAccent
    accent: corticalBorer
  - type: Sprite
    drawdepth: SmallMobs
    sprite: _Ship14/Mobs/Animals/cortical_borer.rsi
    scale: 0.8, 0.8
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base", "movement" ]
      state: larva
  - type: SpriteMovement
    movementLayers:
      movement:
        state: larva-moving
    noMovementLayers:
      movement:
        state: larva
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobState
  - type: Blindable
  - type: MobThresholds
    thresholds:
      0: Alive
      10: Critical
      20: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 5
  - type: DamageStateVisuals
    states:
      Alive:
        Base: larva
      Critical:
        Base: dead
      Dead:
        Base: splat
  - type: CombatMode
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 1
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.25
    damageRecovery:
      types:
        Asphyxiation: -0.25
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.1
  - type: NoSlip
  - type: CanEscapeInventory
  - type: Tag
    tags: []

- type: entity
  parent: BaseItem
  id: CorticalBorerEgg
  name: suspicious egg
  description: A faintly pulsating egg with an unusual shell.
  components:
  - type: CorticalBorerEgg
  - type: GhostRole
    name: ghost-role-information-cortical-borer-name
    description: ghost-role-information-cortical-borer-description
    rules: ghost-role-information-cortical-borer-rules
    mindRoles:
    - MindRoleCorticalBorer
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: MobCorticalBorer
  - type: Sprite
    sprite: _Ship14/Mobs/Animals/cortical_borer.rsi
    state: egg
  - type: Item
    size: Tiny
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic

- type: entity
  id: CorticalBorerTrappedMind
  name: trapped mind
  categories: [ HideSpawnMenu ]
  components:
  - type: Eye
  - type: DoAfter
  # The do-after overlay uses the hidden sprite's bounds to position the bar.
  - type: Sprite
    visible: false
    sprite: Markers/cross.rsi
    state: blue
