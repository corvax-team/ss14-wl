- type: entity
  parent: BaseAction
  id: ActionCorticalBorerParalyze
  components:
  - type: Action
    checkCanInteract: false
    itemIconStyle: BigAction
    raiseOnUser: true
    priority: -20
  - type: Sprite
    sprite: _Ship14/Interface/Actions/cortical_borer.rsi
    layers:
    - state: paralyze
      map: ["enum.ActionVisuals.Icon"]
    - state: paralyze-active
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:CorticalBorerParalyzeActionEvent

