- type: entity
  name: internal affairs agent's rubber stamp
  parent: RubberStampBase
  id: RubberStampIAA
  suffix: DO NOT MAP
  components:
    - type: Stamp
      stampedName: stamp-component-stamped-name-iaa
      stampedColor: "#33CC33"
      stampState: "paper_stamp-ok"
    - type: Sprite
      sprite: Corvax/Objects/Misc/stamps.rsi
      state: stamp-iaa
    # WL-changes-Start
    - type: Item
      inhandVisuals:
        left:
        - state: stamp-inhand-left
        - state: handle-inhand-left
          color: "#33CC33"
        right:
        - state: stamp-inhand-right
        - state: handle-inhand-right
          color: "#33CC33"
    # WL-changes-End

- type: entity
  name: magistrate's rubber stamp
  parent: [RubberStampBase, BaseCommandContraband]
  id: RubberStampMagistrate
  categories: [ DoNotMap ]
  components:
  - type: Stamp
    stampedName: stamp-component-stamped-name-magistrate
    stampedColor: "#eebe35"
    stampState: "paper_stamp-qm"
  - type: Sprite
    sprite: Corvax/Objects/Misc/stamps.rsi
    state: stamp-magistrate
  # WL-changes-Start
  - type: Item
    inhandVisuals:
      left:
      - state: stamp-inhand-left
      - state: handle-inhand-left
        color: "#eebe35"
      right:
      - state: stamp-inhand-right
      - state: handle-inhand-right
        color: "#eebe35"
  # WL-changes-End
