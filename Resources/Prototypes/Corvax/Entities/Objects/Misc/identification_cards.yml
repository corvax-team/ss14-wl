- type: entity
  parent: IDCardStandard
  id: IAAIDCard
  name: internal affairs agent ID card
  components:
  - type: Sprite
    layers:
    - state: silver
    # WL-Resprite-Start
    # - state: stripe_top
    #   color: "#1b67a5"
    # - state: stripe_bottom
    #   color: "#0e4069"
    # WL-Resprite-End
    - sprite: &icon-rsi Corvax/Interface/Misc/job_icons.rsi
      offset: &icon-offset -0.09375, 0.0625
      state: IAA
  - type: PresetIdCard
    job: IAA

- type: entity
  parent: IDCardStandard
  id: PilotIDCard
  name: pilot ID card
  components:
  - type: Sprite
    layers:
    - state: default
    # WL-Resprite-Start
    # - state: stripe_top
    #   color: &color-security-top "#cb0000"
    # - state: stripe_bottom
    #   color: &color-security-bottom "#830000"
    # WL-Resprite-End
    - sprite: *icon-rsi
      offset: *icon-offset
      state: Pilot
  - type: PresetIdCard
    job: Pilot

